name: Import new posts

on:
  schedule:
    - cron: '17 * * * *'  # every hour, at 17 minutes past
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be added'
        type: boolean
        default: true
      since:
        description: 'Import posts from this date (YYYY-MM-DD). Leave empty to use the site setting.'
        required: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch new posts
        env:
          IG_TOKEN_SHAZLAN: ${{ secrets.IG_TOKEN_SHAZLAN }}
          IG_TOKEN_PIC_SHAZ: ${{ secrets.IG_TOKEN_PIC_SHAZ }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SINCE: ${{ inputs.since }}
        run: node scripts/import.mjs
      - name: Save to the site
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if git diff --quiet content.json; then echo "No changes"; exit 0; fi
          git config user.name "shazlan.com import"
          git config user.email "shazlan-s@users.noreply.github.com"
          git add content.json
          git commit -m "Import new posts"
          git push
